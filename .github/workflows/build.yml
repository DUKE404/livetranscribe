name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Klucz podpisu (jeśli ustawiono sekret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Testy i budowa (APK + AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease bundleRelease

      - name: Przygotuj pliki
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/LiveTranscribe.apk
          cp app/build/outputs/bundle/release/*.aab out/LiveTranscribe.aab

      - uses: actions/upload-artifact@v4
        with:
          name: LiveTranscribe
          path: out/

      - name: Wydanie (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LiveTranscribe 1.0.${{ github.run_number }}
          body: |
            Pobierz plik **LiveTranscribe.apk** na telefon z Androidem i zainstaluj go.
            Instrukcja: plik INSTRUKCJA.md w repozytorium.
          files: |
            out/LiveTranscribe.apk
            out/LiveTranscribe.aab

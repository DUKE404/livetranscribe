# LiveTranscribe Web – konfiguracja Render
services:
  - type: web
    name: livetranscribe
    runtime: node
    region: frankfurt
    plan: free
    rootDir: web
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GROQ_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
